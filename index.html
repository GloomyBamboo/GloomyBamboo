<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Буктрейлер</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background-image: url('img/old paper 2.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
        }

        header {
            display: grid;
            place-items: center;
            text-align: center;
        }

        footer {
            display: grid;
            place-items: center;
        }

        main {
            display: grid;
            place-items: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Буктрейлер по роману Ф. М. Достоевского «Преступление и наказание»</h1>
    </header>

    <main>
        <video width="1000" height="600" controls>
            <source src="img/videobook.mp4" type="video/mp4">
            Ваш браузер не поддерживает видео.
        </video>
    </main>
</body>
</html>
